[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "weathersummary"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/weathersummary"]
check_untyped_defs = true
warn_unused_ignores = true